# Builds de release COINWOW Core : Linux x86_64, Windows x64 et macOS arm64.
# Le Mac est compile ici sur macos-15 pour cibler macOS 15 minimum (un build fait
# sur un Mac recent exige la derniere version de macOS). L'app Mac sortie d'ici est
# NON SIGNEE et reste hors du brouillon de release : le developpeur la telecharge,
# la signe et la notarise chez lui (contrib/macdeploy/sign-notarize.sh).
#
# Lancement manuel : onglet Actions > "Release builds" > Run workflow (ne publie rien,
# les fichiers sont seulement disponibles comme "artifacts" pendant 14 jours).
# Sur un tag vX.Y.Z : crée en plus un BROUILLON de release GitHub (jamais publié
# automatiquement ; c'est toi qui cliques sur "Publish").
#
# Windows n'est pas signe (pas de certificat). Aucun secret n'est stocke dans GitHub.
name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DEPENDS_COMMON: NO_ZMQ=1 NO_USDT=1

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl make patch bison ninja-build pkgconf python3 xz-utils

      - name: Cache depends
        uses: actions/cache@v5
        with:
          path: depends/built
          key: rel-linux-depends-${{ hashFiles('depends/**') }}

      - name: Build dependencies
        run: make -C depends HOST=x86_64-pc-linux-gnu NO_QT=1 $DEPENDS_COMMON -j"$(nproc)"

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF \
            -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON \
            -DREDUCE_EXPORTS=ON -DWITH_CCACHE=OFF -DINSTALL_MAN=OFF
          cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"; [ "${GITHUB_REF_TYPE}" = "tag" ] || VER="dev-${GITHUB_SHA::7}"
          D="coinwow-${VER}-x86_64-linux-gnu"
          mkdir -p "dist/$D"
          cp build/bin/* "dist/$D/"
          strip "dist/$D"/* || true
          cp COPYING share/examples/coinwow.conf "dist/$D/" 2>/dev/null || true
          tar -C dist -czf "$D.tar.gz" "$D"
          "dist/$D/coinwowd" --version | head -1

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64
          path: coinwow-*.tar.gz
          retention-days: 14

  windows-x64:
    name: Windows x64 (cross-compilé depuis Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl make patch bison ninja-build pkgconf python3 xz-utils zip nsis g++-mingw-w64-x86-64-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v5
        with:
          path: depends/built
          key: rel-win64-depends-${{ hashFiles('depends/**') }}

      - name: Build dependencies
        run: make -C depends HOST=x86_64-w64-mingw32 $DEPENDS_COMMON -j"$(nproc)"

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON -DBUILD_GUI_TESTS=OFF -DBUILD_TESTS=ON -DBUILD_BENCH=OFF \
            -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON \
            -DREDUCE_EXPORTS=ON -DWITH_CCACHE=OFF -DINSTALL_MAN=OFF \
            -DCMAKE_CXX_FLAGS='-Wno-error=maybe-uninitialized'
          cmake --build build -j"$(nproc)"

      # Le script NSIS exige la cible test_coinwow, donc les tests sont compiles (pas executes).
      - name: Installateur Windows (NSIS, facultatif)
        continue-on-error: true
        run: cmake --build build --target deploy

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"; [ "${GITHUB_REF_TYPE}" = "tag" ] || VER="dev-${GITHUB_SHA::7}"
          cp build/*-setup.exe "coinwow-${VER}-win64-setup.exe" 2>/dev/null || true
          D="coinwow-${VER}-win64"
          mkdir -p "dist/$D"
          cp build/bin/*.exe "dist/$D/"
          rm -f "dist/$D/test_coinwow.exe"
          x86_64-w64-mingw32-strip "dist/$D"/*.exe || true
          cp COPYING share/examples/coinwow.conf "dist/$D/" 2>/dev/null || true
          (cd dist && zip -r "../$D.zip" "$D")

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: |
            coinwow-*.zip
            coinwow-*-setup.exe
          retention-days: 14

  macos-arm64:
    name: macOS arm64 (non signé, cible macOS 15)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Xcode
        run: |
          xcode-select -p
          clang --version

      - name: Install Homebrew packages
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -o pipefail
          filter_brew_notice() { grep -v -F 'HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK' || true; }
          { brew install --quiet python@3 || brew link --overwrite python@3; } 2>&1 | filter_brew_notice
          brew install --quiet ninja pkgconf boost libevent qt@6 qrencode 2>&1 | filter_brew_notice

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DBUILD_GUI=ON -DBUILD_GUI_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF \
            -DWITH_ZMQ=OFF -DREDUCE_EXPORTS=ON -DWITH_CCACHE=OFF -DINSTALL_MAN=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      # Homebrew splits Qt into several formulae (qtbase, qttranslations, ...), so
      # macdeployqtplus cannot find the plugins next to the translations. Point it
      # at qtbase, which holds the platform plugins ("cocoa"), and fail early if
      # they are not there.
      - name: Deploy (app + zip)
        run: |
          QTDIR="$(brew --prefix qtbase)"
          export QTDIR
          echo "QTDIR=$QTDIR"
          find "$QTDIR/" -name 'libqcocoa.dylib' 2>/dev/null | head -3
          test -f "$QTDIR/share/qt/plugins/platforms/libqcocoa.dylib" \
            || { echo "Qt cocoa platform plugin not found in $QTDIR"; exit 1; }
          cmake --build build --target deploy

      - name: Locate the deployed app
        run: |
          APP="$(find build -maxdepth 3 -type d -name 'COINWOW-Qt.app' -exec test -d '{}/Contents/Frameworks' \; -print | head -1)"
          echo "App: $APP"
          [ -n "$APP" ] || { echo "deployed app not found"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Check the framework layout and the minimum macOS version
        run: |
          # Frameworks must keep their symlinks (Versions/Current, top-level binary),
          # otherwise codesign later refuses them.
          for fw in "$APP"/Contents/Frameworks/*.framework; do
            [ -L "$fw/Versions/Current" ] || { echo "Broken framework (no Current symlink): $fw"; exit 1; }
          done
          # The app cannot start without the Qt platform plugin.
          [ -f "$APP/Contents/PlugIns/platforms/libqcocoa.dylib" ] \
            || { echo "Missing Contents/PlugIns/platforms/libqcocoa.dylib"; exit 1; }
          : > minos.txt
          while IFS= read -r f; do
            vtool -show-build "$f" 2>/dev/null | awk -v f="$f" '/minos/{print $2, f}' >> minos.txt || true
          done < <(find "$APP" -type f \( -perm -u+x -o -name '*.dylib' \))
          sort -V minos.txt | tail -5 | tee -a "$GITHUB_STEP_SUMMARY"
          HIGHEST="$(sort -V minos.txt | tail -1 | awk '{print $1}')"
          echo "Highest minimum macOS: $HIGHEST"
          [ -n "$HIGHEST" ] || { echo "no Mach-O found"; exit 1; }
          [ "$(printf '%s\n15.0\n' "$HIGHEST" | sort -V | tail -1)" = "15.0" ] \
            || { echo "A binary requires macOS $HIGHEST (> 15.0)"; exit 1; }

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"; [ "${GITHUB_REF_TYPE}" = "tag" ] || VER="dev-${GITHUB_SHA::7}"
          # ditto keeps symlinks and permissions, unlike a plain zip.
          ditto -c -k --keepParent "$APP" "coinwow-${VER}-macos-arm64-unsigned.zip"
          # Verify the archive round-trips with its symlinks intact.
          rm -rf verify && mkdir verify && ditto -x -k "coinwow-${VER}-macos-arm64-unsigned.zip" verify
          for fw in verify/COINWOW-Qt.app/Contents/Frameworks/*.framework; do
            [ -L "$fw/Versions/Current" ] || { echo "Archive lost a framework symlink: $fw"; exit 1; }
          done

      # Artefact SEPARE : il n'entre ni dans SHA256SUMS ni dans le brouillon de release.
      - uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-unsigned
          path: coinwow-*-macos-arm64-unsigned.zip
          retention-days: 14

  checksums:
    name: SHA256SUMS + brouillon de release
    needs: [linux-x86_64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Seulement Linux et Windows : l'app Mac non signee n'est jamais publiee.
      - uses: actions/download-artifact@v7
        with:
          name: linux-x86_64
          path: out

      - uses: actions/download-artifact@v7
        with:
          name: windows-x64
          path: out

      - name: Checksums
        run: |
          cd out
          sha256sum coinwow-* | tee SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: all-with-checksums
          path: out/*
          retention-days: 14

      - name: Brouillon de release (tags seulement, jamais publié)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "COINWOW Core ${GITHUB_REF_NAME}" \
            --notes-file doc/coinwow/release-notes-1.0.0.md || \
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "COINWOW Core ${GITHUB_REF_NAME}" --notes "Brouillon."
