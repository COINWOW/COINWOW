name: Issue or feature request related to the GUI
description: Any report, issue or feature request related to the GUI
labels: [GUI]
body:
- type: checkboxes
  id: acknowledgement
  attributes:
    label: This issue is about the COINWOW Core GUI (coinwow-qt)
    description: COINWOW has no separate GUI repository; GUI issues are tracked here.
    options:
      - label: I still think this issue should be opened here
        required: true
- type: textarea
  id: gui-request
  attributes:
    label: Report
  validations:
    required: true
